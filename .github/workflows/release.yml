name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish a GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release gate is the CI gate. A tag should never point at a commit
      # that would not have passed on a pull request.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The tag reaches the shell through the environment, never through
      # `${{ }}` interpolation. Actions expands expressions before the shell
      # parses the line, so an interpolated tag containing shell metacharacters
      # would run as code with this job's `contents: write` token -- quoting at
      # the YAML level does not help, because the quotes are added after the
      # substitution has already happened.
      - name: Package the built extension
        env:
          TAG: ${{ inputs.tag }}
        run: tar -czf "expand-url-${TAG}.tar.gz" -C dist .

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "expand-url-${TAG}.tar.gz"

      # Publishing to the Raycast Store is deliberately not automated: `ray
      # publish` needs an interactive Raycast login, and the extension must be
      # MIT-licensed to be accepted at all. See AGENTS.md.
      - name: Note on store publication
        run: |
          echo "::notice::Built and released. Publishing to the Raycast Store is a manual step (see AGENTS.md)."
