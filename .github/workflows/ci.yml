name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. GitHub occasionally does not raise a `synchronize` event for
  # a push to a pull request branch, which leaves the head commit with no CI run
  # and no way to ask for one; this makes that recoverable without pushing an
  # empty commit to provoke it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # `--relaxed` because ray lint hard-requires an MIT license and this
      # project is Unlicense. That also switches off manifest, icon and store
      # metadata validation, which test/manifest.test.ts re-implements; ESLint
      # and Prettier still run in full here.
      - name: Lint
        run: npm run lint

      # Generates raycast-env.d.ts from the manifest, which typecheck needs.
      - name: Build
        run: npm run build

      - name: Check raycast-env.d.ts is up to date
        run: |
          if ! git diff --exit-code -- raycast-env.d.ts; then
            echo "::error::raycast-env.d.ts is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
