name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # `ray lint` validates the extension manifest and icons in addition to
      # running ESLint, so it catches manifest breakage that tsc never sees.
      - name: Lint
        run: npm run lint

      # Generates raycast-env.d.ts from the manifest, which typecheck needs.
      - name: Build
        run: npm run build

      - name: Check raycast-env.d.ts is up to date
        run: |
          if ! git diff --exit-code -- raycast-env.d.ts; then
            echo "::error::raycast-env.d.ts is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
